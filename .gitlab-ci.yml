# =================================================================
# KMT CI
# =================================================================
# Quality gates and tests, run on merge requests and on the default branch.
#
# This pipeline deliberately stops at "the code is good". It does not build or
# publish release images and it does not deploy anywhere: those steps belong to
# whoever operates an instance. Build your own images from build/Dockerfile,
# which takes a SERVICE build arg of either `server` or `web`.

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  GO_VERSION: "1.25.1"
  GOLANGCI_LINT_VERSION: "v2.5.0"
  # Required by `go test -race`.
  CGO_ENABLED: "1"

stages:
  - dependencies
  - quality
  - test

# Run for merge requests and for pushes to the default branch.
.default_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Frontend tests are the heaviest workload in this pipeline. Keep the quality
# gate for frontend and CI changes, but do not run Vitest for configuration-only
# MRs (such as Renovate onboarding) or backend-only changes.
.frontend_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - web/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - web/**/*
        - .gitlab-ci.yml

.go_template:
  extends: .default_rules
  image: golang:${GO_VERSION}
  before_script:
    - go version
    - go env

.go_cache_pull:
  cache:
    key: ${CI_COMMIT_REF_SLUG}-go-deps
    paths:
      - .go/pkg/mod/
    policy: pull

# =================================================================
# DEPENDENCIES STAGE
# =================================================================

deps:download:
  extends: .go_template
  stage: dependencies
  script:
    - echo "Downloading Go dependencies..."
    - go mod download
    - go mod verify
  cache:
    key: ${CI_COMMIT_REF_SLUG}-go-deps
    paths:
      - .go/pkg/mod/

# =================================================================
# QUALITY STAGE
# =================================================================

quality:fmt:
  extends:
    - .go_template
    - .go_cache_pull
  stage: quality
  needs: ["deps:download"]
  script:
    - echo "Checking code formatting..."
    - |
      if [ -n "$(gofmt -l .)" ]; then
        echo "Code is not formatted. Run 'go fmt ./...' locally"
        gofmt -d .
        exit 1
      fi
    - echo "Code is properly formatted"

quality:vet:
  extends:
    - .go_template
    - .go_cache_pull
  stage: quality
  needs: ["deps:download"]
  script:
    - echo "Running go vet..."
    - go vet ./...
    - echo "go vet passed"

quality:tidy:
  extends:
    - .go_template
    - .go_cache_pull
  stage: quality
  needs: ["deps:download"]
  script:
    - echo "Checking go.mod and go.sum are tidy..."
    - go mod tidy
    - |
      if ! git diff --exit-code go.mod go.sum; then
        echo "go.mod or go.sum are not tidy. Run 'go mod tidy' locally"
        exit 1
      fi
    - echo "go.mod and go.sum are tidy"

quality:lint:
  extends:
    - .go_template
    - .go_cache_pull
  stage: quality
  needs: ["deps:download"]
  script:
    - echo "Installing golangci-lint..."
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
    - echo "Running golangci-lint..."
    - golangci-lint run --timeout 5m --verbose
    - echo "Linting passed"
  allow_failure: false

quality:security:
  extends:
    - .go_template
    - .go_cache_pull
  stage: quality
  needs: ["deps:download"]
  script:
    - echo "Running security checks with govulncheck..."
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - govulncheck ./...
    - echo "No known vulnerabilities found"
  # Advisory: a new upstream CVE should surface loudly without blocking every
  # unrelated merge request.
  allow_failure: true

# =================================================================
# TEST STAGE
# =================================================================

test:frontend:
  extends: .frontend_rules
  image: node:20-alpine
  stage: test
  needs: []
  script:
    - echo "Installing frontend dependencies..."
    - cd web
    - npm ci --no-audit --no-fund
    - echo "Running frontend tests..."
    - npm test -- --run
    - echo "All frontend tests passed"
    - echo "Building frontend..."
    - npm run build
    - echo "Frontend build successful"
  cache:
    key: ${CI_COMMIT_REF_SLUG}-node-modules
    paths:
      - web/node_modules/

test:backend:
  extends:
    - .go_template
    - .go_cache_pull
  stage: test
  needs:
    - deps:download
    - quality:fmt
    - quality:vet
    - quality:tidy
    - quality:lint
    - quality:security
  script:
    - echo "Running backend tests with race detector and coverage..."
    - go test -short -v -race -coverprofile=coverage.out -covermode=atomic ./...
    - echo "All backend tests passed"
    - echo "Generating coverage report..."
    - go tool cover -func=coverage.out
    - |
      COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
      echo "Total coverage: ${COVERAGE}%"
    - echo "Generating HTML coverage report..."
    - go tool cover -html=coverage.out -o coverage.html
  coverage: '/total:.*\s+(\d+\.\d+)%/'

test:build:
  extends:
    - .go_template
    - .go_cache_pull
  stage: test
  needs:
    - deps:download
    - quality:fmt
    - quality:vet
    - quality:tidy
    - quality:lint
    - quality:security
  script:
    - echo "Testing build of all binaries..."
    - echo "Building API server..."
    - go build -trimpath -buildvcs=false -mod=readonly -o bin/server ./cmd/server
    - echo "Building web server..."
    - go build -trimpath -buildvcs=false -mod=readonly -o bin/web ./cmd/web
    - echo "All binaries built successfully"
    - ls -lh bin/
