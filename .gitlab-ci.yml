# =================================================================
# KMT CI
# =================================================================
# Quality gates and tests, run on merge requests and on the default branch.
#
# This pipeline deliberately stops at "the code is good". It does not build or
# publish release images and it does not deploy anywhere: those steps belong to
# whoever operates an instance. Build your own images from build/Dockerfile,
# which takes a SERVICE build arg of `server`, `web` or `mcp-server`.

include:
  # DefensePoint reusable security components. Secrets and SAST are warn-only
  # (findings surface but do not block). The dependency scan blocks on
  # Critical CVEs only.
  - component: $CI_SERVER_FQDN/cloud/ci-components/security/secrets@~latest
    inputs:
      stage: security
      exit_code: 0
  - component: $CI_SERVER_FQDN/cloud/ci-components/security/sast@~latest
    inputs:
      stage: security
      exit_code: 0
      config: auto
  - component: $CI_SERVER_FQDN/cloud/ci-components/security/dependencies@~latest
    inputs:
      stage: security
      exit_code: 1
      severity: CRITICAL
      ignore_unfixed: true

variables:
  GO_VERSION: "1.25.14"
  GOLANGCI_LINT_VERSION: "v2.5.0"
  HADOLINT_VERSION: "v2.15.1"
  TRIVY_VERSION: "0.74.0"
  # Required by `go test -race`.
  CGO_ENABLED: "1"

stages:
  - dependencies
  - quality
  - test
  - security

# Run for merge requests and for pushes to the default branch.
.default_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Frontend tests are the heaviest workload in this pipeline. Keep the quality
# gate for frontend and CI changes, but do not run Vitest for configuration-only
# MRs (such as Renovate onboarding) or backend-only changes.
.frontend_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - web/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - web/**/*
        - .gitlab-ci.yml

.go_template:
  extends: .default_rules
  image: golang:${GO_VERSION}
  before_script:
    - go version
    - go env

.go_cache_pull:
  cache:
    key: ${CI_COMMIT_REF_SLUG}-go-deps
    paths:
      - .go/pkg/mod/
    policy: pull

# =================================================================
# DEPENDENCIES STAGE
# =================================================================

deps:download:
  extends: .go_template
  stage: dependencies
  script:
    - echo "Downloading Go dependencies..."
    - go mod download
    - go mod verify
  cache:
    key: ${CI_COMMIT_REF_SLUG}-go-deps
    paths:
      - .go/pkg/mod/

# =================================================================
# QUALITY STAGE
# =================================================================

quality:fmt:
  extends:
    - .go_template
    - .go_cache_pull
  stage: quality
  needs: ["deps:download"]
  script:
    - echo "Checking code formatting..."
    - |
      if [ -n "$(gofmt -l .)" ]; then
        echo "Code is not formatted. Run 'go fmt ./...' locally"
        gofmt -d .
        exit 1
      fi
    - echo "Code is properly formatted"

quality:vet:
  extends:
    - .go_template
    - .go_cache_pull
  stage: quality
  needs: ["deps:download"]
  script:
    - echo "Running go vet..."
    - go vet ./...
    - echo "go vet passed"

quality:tidy:
  extends:
    - .go_template
    - .go_cache_pull
  stage: quality
  needs: ["deps:download"]
  script:
    - echo "Checking go.mod and go.sum are tidy..."
    - go mod tidy
    - |
      if ! git diff --exit-code go.mod go.sum; then
        echo "go.mod or go.sum are not tidy. Run 'go mod tidy' locally"
        exit 1
      fi
    - echo "go.mod and go.sum are tidy"

quality:lint:
  extends:
    - .go_template
    - .go_cache_pull
  stage: quality
  needs: ["deps:download"]
  script:
    - echo "Installing golangci-lint..."
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
    - echo "Running golangci-lint..."
    - golangci-lint run --timeout 5m --verbose
    - echo "Linting passed"
  allow_failure: false

quality:security:
  extends:
    - .go_template
    - .go_cache_pull
  stage: quality
  needs: ["deps:download"]
  script:
    - echo "Running security checks with govulncheck..."
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    # govulncheck's SSA analyzer panics on generic-type signatures in some
    # dependencies (known x/tools bug). Panic exit and "vulns found" exit
    # share the same code, so detect the panic in the log and swallow only
    # that. Real advisories still surface for review; the security stage's
    # Grype + Trivy jobs are the enforcement.
    - |
      set +e
      govulncheck ./... 2>&1 | tee govulncheck.log
      RC=${PIPESTATUS[0]}
      set -e
      if [ "$RC" -eq 0 ]; then
        echo "No known vulnerabilities found"
        exit 0
      fi
      if grep -q "^panic:" govulncheck.log; then
        echo "govulncheck panicked internally (x/tools/ssa generics bug); coverage delegated to Grype and Trivy."
        exit 0
      fi
      exit "$RC"
  allow_failure: true

# =================================================================
# TEST STAGE
# =================================================================

test:frontend:
  extends: .frontend_rules
  image: node:20-alpine
  stage: test
  needs: []
  script:
    - echo "Installing frontend dependencies..."
    - cd web
    - npm ci --no-audit --no-fund
    - echo "Running frontend tests..."
    - npm test -- --run
    - echo "All frontend tests passed"
    - echo "Building frontend..."
    - npm run build
    - echo "Frontend build successful"
  cache:
    key: ${CI_COMMIT_REF_SLUG}-node-modules
    paths:
      - web/node_modules/

test:backend:
  extends:
    - .go_template
    - .go_cache_pull
  stage: test
  needs:
    - deps:download
    - quality:fmt
    - quality:vet
    - quality:tidy
    - quality:lint
    - quality:security
  script:
    - echo "Running backend tests with race detector and coverage..."
    - go test -short -v -race -coverprofile=coverage.out -covermode=atomic ./...
    - echo "All backend tests passed"
    - echo "Generating coverage report..."
    - go tool cover -func=coverage.out
    - |
      COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
      echo "Total coverage: ${COVERAGE}%"
    - echo "Generating HTML coverage report..."
    - go tool cover -html=coverage.out -o coverage.html
  coverage: '/total:.*\s+(\d+\.\d+)%/'

test:integration:
  extends:
    - .go_template
    - .go_cache_pull
  stage: test
  needs:
    - deps:download
    - quality:fmt
    - quality:vet
    - quality:tidy
    - quality:lint
    - quality:security
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: kmt_test
    POSTGRES_USER: kmt
    POSTGRES_PASSWORD: kmt
    POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    KMT_TEST_DATABASE_DSN: "host=postgres port=5432 dbname=kmt_test user=kmt password=kmt sslmode=disable"
  script:
    - echo "Running the database-backed suites, including the MCP security posture suite..."
    # The env-gated suites share one database and migrate it, so they must not
    # run in parallel with each other: -p 1 keeps packages sequential.
    #
    # -short stays on: these suites key off KMT_TEST_DATABASE_DSN alone, while
    # the destructive suites that reset the schema key off -short plus
    # KMT_DESTRUCTIVE_TEST_DATABASE_DSN, which this pipeline does not provide.
    - go test -short -v -p 1 -count=1 ./...
    - echo "All integration tests passed"

test:build:
  extends:
    - .go_template
    - .go_cache_pull
  stage: test
  needs:
    - deps:download
    - quality:fmt
    - quality:vet
    - quality:tidy
    - quality:lint
    - quality:security
  script:
    - echo "Testing build of all binaries..."
    - echo "Building API server..."
    - go build -trimpath -buildvcs=false -mod=readonly -o bin/server ./cmd/server
    - echo "Building web server..."
    - go build -trimpath -buildvcs=false -mod=readonly -o bin/web ./cmd/web
    - echo "Building MCP server..."
    - go build -trimpath -buildvcs=false -mod=readonly -o bin/mcp-server ./cmd/mcp-server
    - echo "All binaries built successfully"
    - ls -lh bin/

# =================================================================
# SECURITY STAGE
# =================================================================
# The `secrets`, `semgrep`, and `trivy-dependency-scan` jobs come from the
# DefensePoint components included above. The two jobs below are local because
# no reusable Hadolint or container-scan component exists yet; promote them
# after this pipeline and the AMFA one both prove them out.

security:dockerfile-lint:
  extends: .default_rules
  stage: security
  needs: []
  image: hadolint/hadolint:${HADOLINT_VERSION}-alpine
  script:
    - echo "Linting build/Dockerfile with hadolint..."
    # --failure-threshold error keeps the job green while our
    # SECURITY_SCAN.md documents accepted-risk warnings/info findings.
    - hadolint --format json --failure-threshold error build/Dockerfile | tee hadolint-report.json
  artifacts:
    when: always
    paths:
      - hadolint-report.json
    expire_in: 30 days
  allow_failure: true

security:container-scan:
  extends: .default_rules
  stage: security
  needs: []
  tags:
    - gitlab-runner1
  image: docker:28.5.2
  services:
    - name: docker:28.5.2-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    FF_NETWORK_PER_BUILD: "true"
    TRIVY_CACHE_DIR: .trivy-cache
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v${TRIVY_VERSION}
    - trivy --version
  script:
    - |
      for svc in server web mcp-server; do
        echo "Building kmt-${svc}:scan..."
        docker build --build-arg SERVICE=${svc} -t kmt-${svc}:scan -f build/Dockerfile .
        echo "Scanning kmt-${svc}:scan with Trivy (informational: CRITICAL + HIGH)..."
        trivy image \
          --severity CRITICAL,HIGH \
          --ignore-unfixed \
          --exit-code 0 \
          --format json \
          --output trivy-image-${svc}.json \
          kmt-${svc}:scan
        trivy image \
          --severity CRITICAL,HIGH \
          --ignore-unfixed \
          --exit-code 0 \
          kmt-${svc}:scan
        echo "Gating on Critical only for kmt-${svc}:scan..."
        trivy image \
          --severity CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          kmt-${svc}:scan
      done
  artifacts:
    when: always
    paths:
      - trivy-image-server.json
      - trivy-image-web.json
      - trivy-image-mcp-server.json
    expire_in: 30 days
  cache:
    key: ${CI_COMMIT_REF_SLUG}-trivy-db
    paths:
      - .trivy-cache/
