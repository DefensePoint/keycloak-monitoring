database:
  host: postgres
  port: 5432
  database: monitoring
  user: monitoring
  password: "${BUNDLED_DB_PASSWORD}"
  ssl_mode: disable

http:
  server:
    host: 0.0.0.0
    port: 7888

web:
  server:
    host: 0.0.0.0
    port: 7880
    static_dir: web/dist
    api_host_url: http://api-server:7888

auth:
  simple:
    enabled: true
    default_user: ""
    default_pass: ""
    default_email: ""
  session:
    secret: "${BUNDLED_SESSION_SECRET}"
    secure: false

keycloak:
  global:
    connection:
      allow_private_ranges: true
    polling:
      events_interval: 10s
      metrics_interval: 15s
      health_interval: 10s
      realm_info_interval: 30s
    # On in the demo, so the Alerts page shows what the checks find in the demo
    # Keycloaks within a minute of startup. The configuration checks run at
    # their defaults; the event checks have none, so they are listed with the
    # values of config.yaml.example.
    config_checker:
      enabled: true
      poll_interval: 1m
    event_checker:
      enabled: true
      poll_interval: 1m
      checks:
        login_error:
          enabled: true
          threshold: 10
          time_window: 5m
        idp_error:
          enabled: true
          threshold: 1
          time_window: 5m
          event_types:
            - IDENTITY_PROVIDER_LOGIN_ERROR
            - IDENTITY_PROVIDER_POST_LOGIN_ERROR
            - IDENTITY_PROVIDER_RESPONSE_ERROR
            - IDENTITY_PROVIDER_RETRIEVE_TOKEN_ERROR
        code_to_token:
          enabled: true
          threshold: 1
          time_window: 5m
        client_error:
          enabled: true
          threshold: 10
          time_window: 5m
        common_errors:
          enabled: true
          threshold: 50
          time_window: 5m
          event_types:
            - REGISTER_ERROR
            - RESET_PASSWORD_ERROR
            - LOGOUT_ERROR
  tenants:
    demo1:
      enabled: true
      is_default: true
      name: Bundled Keycloak 1
      server_url: http://keycloak-1:8080
      admin_realm: master
      client_id: monitoring-service
      client_secret: "${BUNDLED_KC1_CLIENT_SECRET}"
    demo2:
      enabled: true
      name: Bundled Keycloak 2
      server_url: http://keycloak-2:8080
      admin_realm: master
      client_id: monitoring-service
      client_secret: "${BUNDLED_KC2_CLIENT_SECRET}"
