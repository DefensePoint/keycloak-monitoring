database:
  host: postgres
  port: 5432
  database: monitoring
  user: monitoring
  password: "${BUNDLED_DB_PASSWORD}"
  ssl_mode: disable

http:
  server:
    host: 0.0.0.0
    port: 7888

web:
  server:
    host: 0.0.0.0
    port: 7880
    static_dir: web/dist
    api_host_url: http://api-server:7888

auth:
  simple:
    enabled: true
    default_user: ""
    default_pass: ""
    default_email: ""
  session:
    secret: "${BUNDLED_SESSION_SECRET}"
    secure: false

keycloak:
  global:
    connection:
      allow_private_ranges: true
    polling:
      events_interval: 10s
      metrics_interval: 15s
      health_interval: 10s
      realm_info_interval: 30s
    # On in the demo, so the Alerts page shows what the checks find in the demo
    # Keycloaks within a minute of startup. The configuration checks run at
    # their defaults; the event checks have none, so they are listed with the
    # values of config.yaml.example.
    config_checker:
      enabled: true
      poll_interval: 1m
    event_checker:
      enabled: true
      poll_interval: 1m
      checks:
        login_error:
          enabled: true
          threshold: 10
          time_window: 5m
        idp_error:
          enabled: true
          threshold: 1
          time_window: 5m
          event_types:
            - IDENTITY_PROVIDER_LOGIN_ERROR
            - IDENTITY_PROVIDER_POST_LOGIN_ERROR
            - IDENTITY_PROVIDER_RESPONSE_ERROR
            - IDENTITY_PROVIDER_RETRIEVE_TOKEN_ERROR
        code_to_token:
          enabled: true
          threshold: 1
          time_window: 5m
        client_error:
          enabled: true
          threshold: 10
          time_window: 5m
        common_errors:
          enabled: true
          threshold: 50
          time_window: 5m
          event_types:
            - REGISTER_ERROR
            - RESET_PASSWORD_ERROR
            - LOGOUT_ERROR
        amfa_fallback:
          enabled: true
          threshold: 1
          time_window: 5m
    # The AMFA mirror and alert checks, for the AMFA tenant below; without
    # AMFA=1 they have nothing to read. The seeded AMFA history spans 30 days,
    # so the mirror's first run looks that far back.
    amfa_mirror:
      enabled: true
      backfill_days: 30
    amfa_checker:
      enabled: true
      checks:
        risk_rejected: { enabled: true }
        repeated_risky: { enabled: true, threshold: 3, window: 24h, min_risk_level: 2 }
        vpn_risky: { enabled: true }
        login_error: { enabled: true, threshold: 5, window: 5m }
        client_login_error: { enabled: true, threshold: 5, window: 5m }
  tenants:
    demo1:
      enabled: true
      is_default: true
      name: Bundled Keycloak 1
      server_url: http://keycloak-1:8080
      admin_realm: master
      client_id: monitoring-service
      client_secret: "${BUNDLED_KC1_CLIENT_SECRET}"
    demo2:
      enabled: true
      name: Bundled Keycloak 2
      server_url: http://keycloak-2:8080
      admin_realm: master
      client_id: monitoring-service
      client_secret: "${BUNDLED_KC2_CLIENT_SECRET}"
    # The AMFA tenant, on with make docker-demo-up AMFA=1 and disabled without
    # it. See docker-compose.amfa.yml.
    demo3:
      enabled: ${BUNDLED_AMFA}
      name: Bundled Keycloak with AMFA
      server_url: http://keycloak-amfa:${BUNDLED_AMFA_KC_PORT}
      admin_realm: master
      client_id: monitoring-service
      client_secret: "${BUNDLED_KC3_CLIENT_SECRET}"
      amfa:
        enabled: ${BUNDLED_AMFA}
        events_lookback_days: 30
        # The engine's monitoring API, on port 80 in the AMFA Keycloak's
        # network namespace.
        api:
          base_url: http://keycloak-amfa
