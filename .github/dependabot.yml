version: 2
updates:
  # Go modules (go.mod / go.sum at repo root)
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"

  # Root package.json (commitlint/husky tooling)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"

  # Web frontend
  - package-ecosystem: "npm"
    directory: "/web"
    target-branch: "main"
    schedule:
      interval: "weekly"

  # Base images in build/Dockerfile
  - package-ecosystem: "docker"
    directory: "/build"
    target-branch: "main"
    schedule:
      interval: "weekly"

  # Keeps GitHub Actions up to date once you add workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
